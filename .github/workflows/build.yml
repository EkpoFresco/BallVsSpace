name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Rokit
        run: ./game/tools/ci/install-rokit-ci.ps1
      - name: Install pinned tools
        env:
          ROKIT_CI_TOKEN: ${{ github.token }}
        run: |
          rokit authenticate github --token $env:ROKIT_CI_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'Rokit authentication failed' }
          rokit install --no-trust-check
      - name: Check source and build places
        run: ./game/tools/verify.ps1
      - name: Verify saved primary place matches source
        run: |
          git diff --exit-code -- game/places/BallVsSpace.rbxl
          if ($LASTEXITCODE -ne 0) { throw 'Saved primary place is stale. Run game/tools/verify.ps1 and commit the updated place.' }
      - name: Validate tooling and repository links
        run: |
          node --test game/tools/tests/*.test.mjs
          node game/tools/audit-repository.mjs
      - name: Upload place builds
        uses: actions/upload-artifact@v4
        with:
          name: BallVsSpace-${{ github.sha }}
          path: |
            game/places/BallVsSpace.rbxl
            game/builds/BallVsSpace.rbxlx
          if-no-files-found: error
          retention-days: 14
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: |
            game/test-evidence/runs/format.log
            game/test-evidence/runs/lint.log
            game/test-evidence/runs/typecheck.log
            game/test-evidence/runs/build-hashes.json
          if-no-files-found: warn
          retention-days: 14
