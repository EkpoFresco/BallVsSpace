<style>
@font-face{font-family:BVSAction;src:url('__DISPLAY_FONT__') format('truetype');font-style:italic;font-weight:900;font-display:swap}
@font-face{font-family:BVSAction;src:url('__BODY_FONT__') format('truetype');font-style:normal;font-weight:400;font-display:swap}
#bvs-action-menus{--am-ink:#100d14;--am-surface:#211c25;--am-card:#302b34;--am-line:#645866;--am-white:#fff9f4;--am-muted:#c4bbc5;--am-paper:#ede6dd;--am-red:#ff3560;--am-magenta:#b9105b;--am-accent:#8eefe5;--am-graphic:.85;--am-hero-scale:1;color:var(--am-white);font-family:BVSAction,Arial,sans-serif;font-size:14px;font-weight:400;line-height:1.4;font-synthesis:none;container-type:inline-size;isolation:isolate}

#bvs-action-menus .am-header:before{content:"";position:absolute;inset:0;z-index:-1;opacity:var(--am-graphic);background:linear-gradient(122deg,transparent 0 57%,#ff8aa54d 57% 61%,transparent 61% 64%,#63002980 64% 66%,transparent 66% 81%,#ffb0c660 81% 82%,transparent 82%),repeating-linear-gradient(128deg,transparent 0 75px,#ff608a33 75px 115px,transparent 115px 145px);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}

#bvs-action-menus .am-icon{display:block;flex-shrink:0;background-image:url('__ICONS__');background-size:800% 400%;width:29px;aspect-ratio:1;background-repeat:no-repeat}

<section id="bvs-action-menus" aria-label="Ball VS Space action menu design">
 <div class="am-stage">
  <div class="am-topbar">
   <div class="am-brand am-display">BALL <span>VS</span><br>SPACE</div>
   <nav class="am-mainnav" aria-label="Game menus"><button type="button" class="am-nav cursor-interaction" data-screen="Inventory">INVENTORY</button><button type="button" class="am-nav cursor-interaction" data-screen="Store">STORE</button></nav>
  </div>
  <section class="am-window" data-window aria-label="Inventory">
   <header class="am-header" data-header data-ghost="INVENTORY"><h2 class="am-title am-display" data-title>INVENTORY</h2><button type="button" class="am-close cursor-interaction" data-close aria-label="Close Inventory">×</button></header>
   <div class="am-toolbar"><nav class="am-categories" data-inventory-tabs aria-label="Inventory categories"></nav><nav class="am-categories" data-store-tabs aria-label="Store categories" hidden></nav><div class="am-balances" data-balances hidden><span class="am-balance" aria-label="0 coins"><span class="am-icon" data-icon="Coin" aria-hidden="true"></span>0</span><span class="am-balance" aria-label="0 gems"><span class="am-icon" data-icon="Gem" aria-hidden="true"></span>0</span></div></div>
   <div class="am-inventory" data-inventory>
    <section class="am-collection" aria-label="Ball collection"><div class="am-section-line"><h3 class="am-display">YOUR COLLECTION</h3><span class="am-count">12 appearances</span></div><div class="am-grid" data-grid></div></section>
    <section class="am-detail" data-detail aria-label="Axe Ball details"><div class="am-detail-art"><span class="am-detail-state" data-detail-state>SELECTED</span><div class="am-hero-wrap"><span class="am-orb" data-hero aria-hidden="true"></span><span class="am-icon am-weapon" data-weapon aria-hidden="true"></span></div></div><div class="am-detail-copy"><span class="am-kit" data-kit>Anchor kit</span><h3 class="am-ball-heading am-display" data-name>Axe Ball</h3><p class="am-description" data-description>Spins an axe, widening its territory.</p><button type="button" class="am-action cursor-interaction" data-equip> EQUIP BALL </button></div></section>
   </div>
   <div class="am-other" data-other hidden></div>
   <div class="am-store" data-store hidden>
    <section class="am-feature" aria-label="Collection spotlight"><span class="am-eyebrow">THE BALL COLLECTION</span><h3 class="am-feature-heading am-display">FIND YOUR<br>NEXT FAVORITE.</h3><div class="am-feature-art" aria-hidden="true"><span class="am-orb am-feature-orb" data-art="Verity"></span><span class="am-orb am-feature-small" data-art="Orbit"></span><span class="am-orb am-feature-tiny" data-art="Burst"></span></div><p>12 ball appearances.<br>Yours to explore.</p><button type="button" class="am-action cursor-interaction" data-explore>EXPLORE BALLS</button></section>
    <section class="am-offers" data-offers aria-label="Store collection previews"></section>
   </div>
   <footer class="am-footer"><span data-footer>All 12 appearances are available.</span><span class="am-equipped"><span class="am-orb" data-equipped-art aria-hidden="true"></span><span data-equipped>Equipped: Verity Ball</span></span></footer>
  </section>
  <section class="am-closed" data-closed hidden><h2 class="am-display" data-closed-title>INVENTORY CLOSED</h2><button type="button" class="am-action cursor-interaction" data-open>OPEN INVENTORY</button></section>
  <div class="am-announcer" aria-live="polite" data-feedback></div>
 </div>
</section>
<script>
(() => {
 const root=document.getElementById('bvs-action-menus');
 const entries=__ENTRIES__,icons=__ICON_POSITIONS__;
 const q=s=>root.querySelector(s),qa=s=>Array.from(root.querySelectorAll(s));
 const state={version:7,view:'Inventory',category:'Balls',storeCategory:'Events',selected:'Axe',equipped:'Verity',open:true,graphics:.85,heroScale:1};
 let feedback='';
 const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n;};
 const button=(cls,text)=>{const b=el('button',cls+' cursor-interaction',text);b.type='button';return b;};
 const setBall=(n,id)=>{n.style.backgroundPosition=entries[id].x+'% '+entries[id].y+'%';};
 const setIcon=(n,id)=>{n.style.backgroundPosition=icons[id][0]+'% '+icons[id][1]+'%';};
 const icon=id=>{const n=el('span','am-icon');n.setAttribute('aria-hidden','true');setIcon(n,id);return n;};
 const orb=id=>{const n=el('span','am-orb');n.setAttribute('aria-hidden','true');setBall(n,id);return n;};
 const categoryIcon={Balls:'Inventory',Explosions:'Explosion',Flyers:'Ufo',Fusion:'Fusion',Events:'Events'};
 for(const scope of ['Inventory','Store']){const parent=q(scope==='Inventory'?'[data-inventory-tabs]':'[data-store-tabs]');for(const category of (scope==='Inventory'?['Balls','Explosions','Flyers','Fusion']:['Events','Balls','Explosions','Flyers'])){const b=button('am-category');b.dataset.category=category;b.dataset.scope=scope;b.append(category==='Balls'?orb('Verity'):icon(categoryIcon[category]),el('span','',category.toUpperCase()));parent.append(b);}}
 for(const [id,entry] of Object.entries(entries)){const b=button('am-ball-button');b.dataset.ball=id;b.setAttribute('aria-label',entry.name);const pic=el('span','am-ball-picture');pic.append(orb(id));const chosen=el('span','am-card-state','SELECTED');chosen.hidden=true;chosen.setAttribute('aria-hidden','true');const equipped=el('span','am-equipped-mark','✓');equipped.hidden=true;equipped.setAttribute('aria-hidden','true');b.append(pic,el('span','am-ball-name',entry.name),chosen,equipped);q('[data-grid]').append(b);}
 const offerData=[['Laser','Laser Ball','BALL APPEARANCE'],['Ray','Ray Ball','BALL APPEARANCE'],['Balloons','Colorful Balloon','FLYER PREVIEW'],['Parasol','Blue Parasol','FLYER PREVIEW']];
 for(const [id,name,kind] of offerData){const card=el('article','am-offer');card.dataset.offerCard=id;const art=el('div','am-offer-art');art.append(Object.hasOwn(entries,id)?orb(id):icon(id),el('span','am-offer-tag',kind));const copy=el('div','am-offer-copy');const b=button('am-action',Object.hasOwn(entries,id)?'VIEW BALL':'PREVIEW');b.dataset.offer=id;copy.append(el('h3','am-offer-name am-display',name),b);card.append(art,copy);q('[data-offers]').append(card);}
 const cosmetic={Explosions:[['Explosion','Explosion'],['Spark','Spark'],['Ring','Ring']],Flyers:[['Ufo','UFO'],['Balloons','Balloons'],['Parasol','Parasol']]};
 const panels={};
 for(const [category,items] of Object.entries(cosmetic)){const panel=el('section');panel.hidden=true;panel.setAttribute('aria-label',category+' previews');panel.append(el('h3','am-other-title am-display',category.toUpperCase()),el('p','am-other-copy','Cosmetic previews'));const list=el('div','am-previews');for(const [id,name]of items){const card=el('article','am-preview-item');const b=button('am-action','PREVIEW');b.dataset.preview=name;card.append(icon(id),el('h3','am-display',name),b);list.append(card);}panel.append(list);panels[category]=panel;q('[data-other]').append(panel);}
 const fusion=el('section','am-fusion');fusion.hidden=true;const fusionCopy=el('div'),explore=button('am-action','EXPLORE BALLS');explore.dataset.explore='';fusionCopy.append(el('h3','am-other-title am-display','BUILD YOUR COLLECTION'),el('p','','Every ball appearance is available to explore. Choose your next look from the Balls tab.'),explore);fusion.append(icon('Fusion'),fusionCopy);panels.Fusion=fusion;q('[data-other]').append(fusion);
 qa('[data-art]').forEach(n=>setBall(n,n.dataset.art));qa('[data-icon]').forEach(n=>setIcon(n,n.dataset.icon));
 const load=saved=>{if(!saved||saved.version!==7)return;for(const k of ['selected','equipped'])if(Object.hasOwn(entries,saved[k]))state[k]=saved[k];if(['Inventory','Store'].includes(saved.view))state.view=saved.view;if(['Balls','Explosions','Flyers','Fusion'].includes(saved.category))state.category=saved.category;if(['Events','Balls'].includes(saved.storeCategory))state.storeCategory=saved.storeCategory;if(typeof saved.open==='boolean')state.open=saved.open;for(const [k,min,max] of [['graphics',.25,1],['heroScale',.9,1.08]])if(Number.isFinite(saved[k]))state[k]=Math.max(min,Math.min(max,saved[k]));};
 const save=()=>window.openai?.setWidgetState?.({modelContent:{design:'Angular action menus',version:7,palette:'Charcoal, crimson-magenta, pale neutral, cyan actions',view:state.view,category:state.category,selected:state.selected,equipped:state.equipped,graphics:state.graphics,heroScale:state.heroScale},privateContent:{...state}})?.catch(()=>{});
 function render(){
  const inventory=state.view==='Inventory',balls=inventory&&state.category==='Balls';
  root.style.setProperty('--am-graphic',state.graphics);root.style.setProperty('--am-hero-scale',state.heroScale);
  q('[data-window]').hidden=!state.open;q('[data-closed]').hidden=state.open;q('[data-window]').setAttribute('aria-label',state.view);q('[data-title]').textContent=state.view.toUpperCase();q('[data-header]').dataset.ghost=state.view.toUpperCase();q('[data-close]').setAttribute('aria-label','Close '+state.view);
  q('[data-closed-title]').textContent=state.view.toUpperCase()+' CLOSED';q('[data-open]').textContent='OPEN '+state.view.toUpperCase();
  q('[data-inventory-tabs]').hidden=!inventory;q('[data-store-tabs]').hidden=inventory;q('[data-balances]').hidden=inventory;q('[data-inventory]').hidden=!balls;q('[data-other]').hidden=!inventory||balls;q('[data-store]').hidden=inventory;
  qa('[data-screen]').forEach(n=>n.setAttribute('aria-pressed',String(state.open&&n.dataset.screen===state.view)));
  qa('[data-category]').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.category===(n.dataset.scope==='Inventory'?state.category:state.storeCategory))));
  for(const [category,panel]of Object.entries(panels))panel.hidden=category!==state.category;
  qa('[data-ball]').forEach(n=>{const id=n.dataset.ball;n.setAttribute('aria-pressed',String(state.selected===id));n.setAttribute('aria-label',entries[id].name+(state.equipped===id?', equipped':''));n.querySelector('.am-card-state').hidden=id!==state.selected;n.querySelector('.am-card-state').textContent=id===state.equipped?'EQUIPPED':'SELECTED';n.querySelector('.am-equipped-mark').hidden=id!==state.equipped||id===state.selected;});
  const entry=entries[state.selected],equipped=state.selected===state.equipped;q('[data-name]').textContent=entry.name;q('[data-kit]').textContent=entry.kit+' kit';q('[data-description]').textContent=entry.description;q('[data-detail]').setAttribute('aria-label',entry.name+' details');q('[data-detail-state]').textContent=equipped?'EQUIPPED':'SELECTED';setBall(q('[data-hero]'),state.selected);
  const weapon=q('[data-weapon]');weapon.hidden=!['Axe','Blade'].includes(state.selected);if(!weapon.hidden)setIcon(weapon,state.selected);
  q('[data-equip]').disabled=equipped;q('[data-equip]').textContent=equipped?'EQUIPPED':'EQUIP BALL';q('[data-equip]').setAttribute('aria-label',equipped?entry.name+' equipped':'Equip '+entry.name);
  setBall(q('[data-equipped-art]'),state.equipped);q('[data-equipped]').textContent='Equipped: '+entries[state.equipped].name;
  q('[data-footer]').textContent=inventory?(balls?'All 12 appearances are available.':'Collection previews'):'All ball appearances are free. No purchase needed.';
  q('[data-feedback]').textContent=feedback;
 }
 root.addEventListener('click',event=>{const target=event.target.closest('button');if(!target||!root.contains(target)||target.disabled)return;feedback='';let focus=null;
  if(target.hasAttribute('data-screen')){state.view=target.dataset.screen;state.open=true;}
  else if(target.hasAttribute('data-category')){const category=target.dataset.category;if(target.dataset.scope==='Store'){if(['Explosions','Flyers'].includes(category)){state.view='Inventory';state.category=category;focus='[data-inventory-tabs] [data-category="'+category+'"]';}else state.storeCategory=category;}else state.category=category;}
  else if(target.hasAttribute('data-ball')){state.selected=target.dataset.ball;feedback=entries[state.selected].name+' selected';}
  else if(target.hasAttribute('data-equip')){state.equipped=state.selected;feedback=entries[state.selected].name+' equipped';}
  else if(target.hasAttribute('data-offer')){const id=target.dataset.offer;state.view='Inventory';state.category=Object.hasOwn(entries,id)?'Balls':'Flyers';if(state.category==='Balls')state.selected=id;else feedback=(id==='Balloons'?'Colorful Balloon':'Blue Parasol')+' preview';focus='[data-inventory-tabs] [data-category="'+state.category+'"]';}
  else if(target.hasAttribute('data-preview'))feedback=target.dataset.preview+' preview';
  else if(target.hasAttribute('data-explore')){state.view='Inventory';state.category='Balls';focus='[data-inventory-tabs] [data-category="Balls"]';}
  else if(target.hasAttribute('data-close')){state.open=false;focus='[data-open]';}
  else if(target.hasAttribute('data-open')){state.open=true;focus='[data-screen="'+state.view+'"]';}
  else return;
  render();save();if(focus)q(focus).focus();
 });
 root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.open){state.open=false;feedback='';render();save();q('[data-open]').focus();}});
 window.addEventListener('openai:set_globals',event=>{load(event.detail?.globals?.widgetState?.privateContent);feedback='';render();});
 load(window.openai?.widgetState?.privateContent);render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSlider(state,'graphics',{label:'Graphic intensity',min:.25,max:1,step:.05});tweak.addSlider(state,'heroScale',{label:'Ball preview size',min:.9,max:1.08,step:.02});}
})();
</script>
